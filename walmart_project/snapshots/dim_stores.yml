snapshots:
  - name: dim_store_snapshot
    relation: ref('eph_store')
    config:
      schema: gold
      database: WALMART_CATALOG
      unique_key: store_id
      strategy: timestamp
      updated_at: store_updated_timestamp
      dbt_valid_to_current: "to_date('9999-12-31')"
      hard_deletes: ignore